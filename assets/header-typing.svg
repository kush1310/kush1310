<?xml version="1.0" encoding="utf-8"?>
<svg width="920" height="120" viewBox="0 0 920 120" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <rect width="100%" height="100%" fill="#07080a"/>
  <g font-family="Orbitron, Arial" font-weight="700" fill="#00AFA0">
    <text x="50%" y="42" font-size="28" text-anchor="middle" opacity="0.95">Decrypting the World...</text>
  </g>

  <g font-family="Fira Code, monospace" font-weight="600" fill="#9FBEB8">
    <!-- typing text sequence implemented as three text lines fading in/out -->
    <text id="t1" x="50%" y="80" font-size="20" text-anchor="middle" opacity="0">Kush Amit Shah • Cybersecurity</text>
    <text id="t2" x="50%" y="80" font-size="20" text-anchor="middle" opacity="0">Web Development • Secure Systems</text>
    <text id="t3" x="50%" y="80" font-size="20" text-anchor="middle" opacity="0">C | C++ | Python | Node.js | React</text>

    <animate xlink:href="#t1" attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite" begin="0s"/>
    <animate xlink:href="#t2" attributeName="opacity" values="0;0;1;1;0" dur="6s" repeatCount="indefinite" begin="2s"/>
    <animate xlink:href="#t3" attributeName="opacity" values="0;0;0;1;1;0" dur="6s" repeatCount="indefinite" begin="4s"/>
  </g>

  <!-- subtle glow -->
  <ellipse cx="460" cy="60" rx="360" ry="28" fill="#00AFA0" opacity="0.04">
    <animate attributeName="opacity" values="0.02;0.06;0.02" dur="6s" repeatCount="indefinite"/>
  </ellipse>
</svg>