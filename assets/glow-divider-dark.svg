<?xml version="1.0" encoding="utf-8"?>
<svg width="1200" height="12" viewBox="0 0 1200 12" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none">
  <defs>
    <radialGradient id="gd" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AFA0" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#00FFC6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#00AFA0" stop-opacity="0"/>
    </radialGradient>
    <filter id="blurf" x="-50%" y="-250%" width="200%" height="500%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>

  <rect width="1200" height="12" fill="url(#gd)" filter="url(#blurf)">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite"/>
  </rect>
  <rect x="0" y="5" width="1200" height="1.4" fill="#DFFCF7" opacity="0.14">
    <animate attributeName="x" values="-20;0;20;0;-20" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>