<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" preserveAspectRatio="xMidYMid slice" width="100%" height="260">
  <defs>
    <linearGradient id="bg" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <linearGradient id="ribbon" x1="0" x2="1">
      <stop offset="0%" stop-color="#00AFA0" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#00FFC6" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#00AFA0" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <pattern id="tiny" patternUnits="userSpaceOnUse" width="18" height="18">
      <text x="0" y="14" font-family="monospace" font-size="12" fill="#e9fff7" opacity="0.06">01</text>
    </pattern>
  </defs>

  <!-- glass base -->
  <rect width="1200" height="260" fill="url(#bg)"/>

  <!-- multiple drifting ribbons for depth -->
  <g opacity="0.55">
    <rect x="-300" y="0" width="1800" height="70" fill="url(#ribbon)" filter="url(#blur)" opacity="0.09">
      <animate attributeName="x" values="-300;0;300;-300" dur="8s" repeatCount="indefinite"/>
    </rect>
    <rect x="-500" y="40" width="1800" height="70" fill="url(#ribbon)" filter="url(#blur)" opacity="0.07">
      <animate attributeName="x" values="300;0;-300;300" dur="11s" repeatCount="indefinite"/>
    </rect>
    <rect x="-100" y="80" width="1800" height="60" fill="url(#ribbon)" filter="url(#blur)" opacity="0.06">
      <animate attributeName="x" values="-100;50;-100" dur="7.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- dense vertical streams of binary text -->
  <g font-family="monospace" font-size="12" fill="#006B60" opacity="0.95">
    <!-- 12 columns spaced tighter for higher density -->
    <!-- columns generated manually to ensure GitHub SVG friendliness -->
    <g transform="translate(20,8)">
      <g transform="translate(0,0)">
        <text x="0" y="0">0100100101</text>
        <text x="0" y="22" opacity="0.9">1011010110</text>
        <text x="0" y="44" opacity="0.8">1101101001</text>
        <text x="0" y="66" opacity="0.7">0110011001</text>
        <text x="0" y="88" opacity="0.6">1001100110</text>
        <animateTransform attributeName="transform" type="translate" from="0 -12" to="0 12" dur="3.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.25;1;0.25" dur="3.4s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(80,4)">
      <g>
        <text x="0" y="0">0011001100</text>
        <text x="0" y="22" opacity="0.92">1110001110</text>
        <text x="0" y="44" opacity="0.82">0101010110</text>
        <text x="0" y="66" opacity="0.7">1001100101</text>
        <text x="0" y="88" opacity="0.6">0110011010</text>
        <animateTransform attributeName="transform" type="translate" from="0 -10" to="0 10" dur="3.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.98;0.2" dur="3.9s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(140,10)">
      <g>
        <text x="0" y="0">1100110011</text>
        <text x="0" y="22" opacity="0.9">0011110011</text>
        <text x="0" y="44" opacity="0.78">1010101010</text>
        <text x="0" y="66" opacity="0.68">0100100110</text>
        <text x="0" y="88" opacity="0.56">1111000011</text>
        <animateTransform attributeName="transform" type="translate" from="0 -11" to="0 11" dur="3.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(200,2)">
      <g>
        <text x="0" y="0">0001110011</text>
        <text x="0" y="22" opacity="0.9">1100110011</text>
        <text x="0" y="44" opacity="0.8">0101010101</text>
        <text x="0" y="66" opacity="0.7">1010010110</text>
        <text x="0" y="88" opacity="0.6">0110110101</text>
        <animateTransform attributeName="transform" type="translate" from="0 -9" to="0 9" dur="4.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.18;0.95;0.18" dur="4.2s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(260,8)">
      <g>
        <text x="0" y="0">1010101010</text>
        <text x="0" y="22" opacity="0.9">0101010101</text>
        <text x="0" y="44" opacity="0.8">1110001100</text>
        <text x="0" y="66" opacity="0.68">0001110011</text>
        <text x="0" y="88" opacity="0.58">1100111100</text>
        <animateTransform attributeName="transform" type="translate" from="0 -12" to="0 12" dur="3.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.22;1;0.22" dur="3.6s" repeatCount="indefinite"/>
      </g>
    </g>

    <g transform="translate(340,6)">
      <g>
        <text x="0" y="0">1001100110</text>
        <text x="0" y="22" opacity="0.92">0110011001</text>
        <text x="0" y="44" opacity="0.8">1100110011</text>
        <text x="0" y="66" opacity="0.7">0011110011</text>
        <text x="0" y="88" opacity="0.56">0101010110</text>
        <animateTransform attributeName="transform" type="translate" from="0 -8" to="0 8" dur="4.0s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.2;0.98;0.2" dur="4.0s" repeatCount="indefinite"/>
      </g>
    </g>

    <!-- more columns for density -->
    <g transform="translate(420,12)"><text x="0" y="0">0110011001</text><text x="0" y="22" opacity="0.9">1011100110</text><text x="0" y="44" opacity="0.8">1101101001</text><animateTransform attributeName="transform" type="translate" from="0 -10" to="0 10" dur="3.8s" repeatCount="indefinite"/></g>
    <g transform="translate(500,4)"><text x="0" y="0">1110001110</text><text x="0" y="22" opacity="0.88">0101100101</text><text x="0" y="44" opacity="0.76">0011001100</text><animateTransform attributeName="transform" type="translate" from="0 -9" to="0 9" dur="4.4s" repeatCount="indefinite"/></g>
    <g transform="translate(580,10)"><text x="0" y="0">0101010101</text><text x="0" y="22" opacity="0.86">1010101010</text><text x="0" y="44" opacity="0.74">1111000011</text><animateTransform attributeName="transform" type="translate" from="0 -12" to="0 12" dur="3.5s" repeatCount="indefinite"/></g>
    <g transform="translate(660,6)"><text x="0" y="0">0001110011</text><text x="0" y="22" opacity="0.9">1100110011</text><text x="0" y="44" opacity="0.78">0101010101</text><animateTransform attributeName="transform" type="translate" from="0 -11" to="0 11" dur="3.2s" repeatCount="indefinite"/></g>
    <g transform="translate(740,8)"><text x="0" y="0">1010010110</text><text x="0" y="22" opacity="0.88">0110110101</text><text x="0" y="44" opacity="0.74">1110001100</text><animateTransform attributeName="transform" type="translate" from="0 -10" to="0 10" dur="4.1s" repeatCount="indefinite"/></g>
    <g transform="translate(820,2)"><text x="0" y="0">1001100110</text><text x="0" y="22" opacity="0.87">0110011001</text><text x="0" y="44" opacity="0.76">1100110011</text><animateTransform attributeName="transform" type="translate" from="0 -9" to="0 9" dur="4.6s" repeatCount="indefinite"/></g>
    <g transform="translate(900,14)"><text x="0" y="0">0011110011</text><text x="0" y="22" opacity="0.85">0101010110</text><text x="0" y="44" opacity="0.7">1010101010</text><animateTransform attributeName="transform" type="translate" from="0 -7" to="0 7" dur="3.7s" repeatCount="indefinite"/></g>
    <g transform="translate(980,6)"><text x="0" y="0">1100110011</text><text x="0" y="22" opacity="0.9">0011110011</text><text x="0" y="44" opacity="0.75">1010101010</text><animateTransform attributeName="transform" type="translate" from="0 -8" to="0 8" dur="3.3s" repeatCount="indefinite"/></g>
    <g transform="translate(1040,10)"><text x="0" y="0">0001110011</text><text x="0" y="22" opacity="0.86">1100110011</text><text x="0" y="44" opacity="0.7">0101010101</text><animateTransform attributeName="transform" type="translate" from="0 -6" to="0 6" dur="4.0s" repeatCount="indefinite"/></g>
  </g>

  <!-- faint repeating texture for subtle noise -->
  <rect width="1200" height="260" fill="url(#tiny)" opacity="0.02"/>
</svg>