<?xml version="1.0" encoding="utf-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 12" preserveAspectRatio="none" width="100%" height="12">
  <defs>
    <radialGradient id="g" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00AFA0" stop-opacity="0.95"/>
      <stop offset="40%" stop-color="#00AFA0" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#00AFA0" stop-opacity="0"/>
    </radialGradient>

    <filter id="f" x="-50%" y="-200%" width="200%" height="500%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- soft center glow band -->
  <rect x="0" y="0" width="1200" height="12" fill="url(#g)" filter="url(#f)">
    <animate attributeName="opacity" values="0.45;0.95;0.45" dur="2.8s" repeatCount="indefinite"/>
  </rect>

  <!-- thin crisp highlight line -->
  <rect x="0" y="5.25" width="1200" height="1.5" fill="#DFFCF7" opacity="0.18">
    <animate attributeName="x" values="-20;0;20;0;-20" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>